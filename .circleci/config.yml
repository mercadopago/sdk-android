version: 2.1

orbs:
  android: circleci/android@3.0.2

commands:
  setup-android:
    steps:
      - run:
          name: Install Git LFS
          command: |
            curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
            sudo apt-get install git-lfs
            git lfs install --skip-smudge
      - checkout
      - run:
          name: Set Secrets File
          command: echo "$SECRETS_FILE" | base64 --decode > secrets.properties
      - run:
          name: Download Platform Tools
          command: |
            cd ..
            mkdir android-sdk
            cd android-sdk
            wget -q https://dl.google.com/android/repository/platform-tools-latest-linux.zip
            unzip -q platform-tools-latest-linux.zip
      - run:
          name: Download Commandline Tools
          command: |
            cd ..
            cd android-sdk
            mkdir cmdline-tools
            cd cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q commandlinetools-linux-11076708_latest.zip
            mv cmdline-tools latest
      - run:
          name: Set up Android Home
          command: |
            echo 'export ANDROID_HOME=$HOME/android-sdk
            export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
            export PATH=$PATH:$HOME/android-sdk/platform-tools' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Accept SDK licenses
          command: |
            yes | sdkmanager --licenses || exit 0
            yes | sdkmanager --update || exit 0

jobs:
  lint:
    circleci_ip_ranges: true
    docker:
      - image: cimg/openjdk:17.0.13
    working_directory: ~/repo
    resource_class: xlarge
    steps:
      - setup-android
      - restore_cache:
          keys:
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}
      - run:
          name: Run Detekt
          command: ./gradlew detekt
      - run:
          name: Run KtLint Check
          command: ./gradlew ktlintCheck

  test-coverage:
    circleci_ip_ranges: true
    docker:
      - image: cimg/openjdk:17.0.13
    working_directory: ~/repo
    resource_class: xlarge
    steps:
      - setup-android
      - run:
          name: Check Java Version
          command: java -version
      - restore_cache:
          keys:
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}
      - run:
          name: Install Dependencies
          command: ./gradlew dependencies
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: v1-gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
      - run:
          name: Clean Test Cache
          command: ./gradlew cleanTest
      - run:
          name: Run Code Coverage
          command: ./gradlew koverHtmlReportDebug koverXmlReportDebug --no-build-cache
      - run:
          name: Verify Diff Coverage (80%)
          command: .circleci/scripts/verify-diff-coverage.sh
      #      - run:
      #          name: Run Screenshot Tests
      #          command: ./gradlew verifyPaparazziDebug
      - run:
          name: Collect Test Results
          command: |
            mkdir -p ~/test-results
            find . -path "*/build/test-results/testDebugUnitTest/*.xml" -exec cp {} ~/test-results/ \; 2>/dev/null || true
          when: always
      - store_test_results:
          path: ~/test-results
      - run:
          name: Archive Reports
          command: .circleci/scripts/archive-reports.sh

  documentation-write:
    circleci_ip_ranges: true
    docker:
      - image: cimg/openjdk:17.0.13
    working_directory: ~/repo
    resource_class: xlarge
    steps:
      - setup-android
      - restore_cache:
          keys:
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}
      - run:
          name: Update Dokka Documentation
          command: ./gradlew dokkaHtmlMultiModule
      - persist_to_workspace:
          root: build/dokka/
          paths:
            - htmlMultiModule

  build:
    circleci_ip_ranges: true
    docker:
      - image: cimg/openjdk:17.0.13
    working_directory: ~/repo
    resource_class: xlarge
    steps:
      - setup-android
      - restore_cache:
          keys:
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}
      - run:
          name: Build the app
          command: ./gradlew assembleDebug --parallel --stacktrace
      - run:
          name: Archive APK and AAR
          command: |
            mkdir -p ~/circleci-artifacts/builds
            cp example/build/outputs/apk/debug/example-debug.apk ~/circleci-artifacts/builds/ || true
            cp core-methods/build/outputs/aar/core-methods-debug.aar ~/circleci-artifacts/builds/ || true
      - store_artifacts:
          path: ~/circleci-artifacts
          destination: artifacts

  documentation-deploy:
    docker:
      - image: cimg/node:16.17
    working_directory: ~/repo
    steps:
      - run:
          name: Install Git LFS
          command: |
            curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
            sudo apt-get install git-lfs
            git lfs install --skip-smudge
      - checkout
      - attach_workspace:
          at: build/dokka/
      - run:
          name: Disable Jekyll for GitHub Pages
          command: touch build/dokka/htmlMultiModule/.nojekyll
      - run:
          name: Install gh-pages tool
          command: npm install gh-pages@3.2.3 --silent
      - add_ssh_keys:
          fingerprints:
            - "SHA256:CHbCMOR2Mcw/RHacZ+LuEOqsvk0Vis+R3lzMcdpy9y0"
      - run:
          name: Deploy documentation to GitHub Pages
          command: .circleci/scripts/deploy-docs.sh

  verify-changelog:
    docker:
      - image: cimg/base:2024.01
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Check CHANGELOG.md update
          command: .circleci/scripts/check-changelog.sh

  verify-version-consistency:
    docker:
      - image: cimg/openjdk:17.0.13
    working_directory: ~/repo
    steps:
      - run:
          name: Install Git LFS
          command: |
            curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
            sudo apt-get install git-lfs
            git lfs install --skip-smudge
      - checkout
      - run:
          name: Check version consistency
          command: .circleci/scripts/check-version-consistency.sh

  build-artifacts:
    circleci_ip_ranges: true
    docker:
      - image: cimg/openjdk:17.0.13
    working_directory: ~/repo
    resource_class: xlarge
    steps:
      - setup-android
      - restore_cache:
          keys:
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}
      - run:
          name: Build Debug and Release AARs
          command: ./gradlew assembleDebug assembleRelease --parallel
      - run:
          name: Collect AARs
          command: |
            mkdir -p ~/artifacts/aars/release ~/artifacts/aars/debug
            find . -path "*/build/outputs/aar/*-release.aar" -exec cp {} ~/artifacts/aars/release/ \;
            find . -path "*/build/outputs/aar/*-debug.aar" -exec cp {} ~/artifacts/aars/debug/ \;
      - persist_to_workspace:
          root: ~/artifacts
          paths:
            - aars

  verify-artifacts:
    docker:
      - image: cimg/base:2024.01
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: ~/artifacts
      - run:
          name: Verify AAR Contents
          command: .circleci/scripts/verify-artifacts.sh ~/artifacts/aars/release ~/artifacts/aars/debug

  publish-maven:
    circleci_ip_ranges: true
    docker:
      - image: cimg/openjdk:17.0.13
    working_directory: ~/repo
    steps:
      - setup-android
      - run:
          name: Check Java Version
          command: java -version
      - restore_cache:
          keys:
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
            - v1-gradle-{{ checksum "gradle/libs.versions.toml" }}
      - run:
          name: Install Dependencies
          command: ./gradlew dependencies
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: v1-gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "build.gradle.kts" }}-{{ checksum "settings.gradle.kts" }}
      - run:
          name: Publish to Maven
          command: .circleci/scripts/publish-maven.sh

workflows:
  version: 2
  build:
    jobs:
      - verify-changelog:
          filters:
            branches:
              ignore: main
      - lint
      - test-coverage
      - documentation-write:
          requires:
            - lint
            - test-coverage
      - build:
          requires:
            - lint
            - test-coverage
      - verify-version-consistency:
          filters:
            branches:
              only:
                - main
                - /release\/.*/
      - build-artifacts:
          requires:
            - lint
            - test-coverage
      - verify-artifacts:
          requires:
            - build-artifacts
      - publish-maven:
          requires:
            - verify-artifacts
            - verify-version-consistency
          filters:
            branches:
              only: main
      - documentation-deploy:
          requires:
            - documentation-write
            - publish-maven
          filters:
            branches:
              only: main
