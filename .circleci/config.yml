version: 2.1

orbs:
  android: circleci/android@3.0.2

executors:
  android-executor:
    docker:
      - image: circleci/android:api-30-ndk
    working_directory: ~/repo/core-methods

jobs:
  build:
    executor: android-executor
    steps:
      - checkout

      - run:
          name: Check Java Version
          command: |
            java -version

      - run:
          name: Set up JDK 17
          command: |
            sudo apt update
            sudo apt install -y openjdk-17-jdk

      - run:
          name: Check Java Version Again
          command: |
            java -version

      - run:
          name: Install dependencies
          command: ./gradlew dependencies

      - run:
          name: Build the app
          command: ./gradlew assemble

      - run:
          name: Run Detekt
          command: ./gradlew detekt

      - run:
          name: Run KLint
          command: ./gradlew ktlintCheck

      - run:
          name: Run unit tests
          command: ./gradlew test

workflows:
  version: 2
  build:
    jobs:
      - build
