version: 2.1

orbs:
  android: circleci/android@3.0.2

executors:
  android-executor:
    docker:
      - image: circleci/android:api-30
    working_directory: ~/repo

jobs:
  build:
    executor: android-executor
    docker:
      - image: cimg/openjdk:17.0.13
    steps:
      - checkout

      # PRE SETUP
      - run:
          name: Download android sdk
          command: |
            cd ..
            mkdir android-sdk
            cd android-sdk
            wget https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
            unzip sdk-tools-linux-4333796.zip
      - run:
          name: Set env vars for android sdk tools
          command: |
            echo '
            export ANDROID_HOME=$HOME/android-sdk
            export PATH=$PATH:$HOME/android-sdk/tools/bin
            export PATH=$PATH:$HOME/android-sdk/platform-tools' >> $BASH_ENV

      # SETUP STEP
      - run:
          name: Verify ANDROID_HOME after
          command: echo $ANDROID_HOME

      - run:
          name: Check Java Version
          command: java -version

      - run:
          name: Install dependencies
          command: ./gradlew dependencies

      # TEST STEP
      - run:
          name: Run Detekt
          command: ./gradlew detekt
      - run:
          name: Run KLint Check
          command: ./gradlew ktlintCheck


      # BUILD STEP
      - run:
          name: Build the app
          command: ./gradlew assemble --stacktrace

workflows:
  version: 2
  build:
    jobs:
      - build
