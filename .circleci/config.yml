version: 2.1

orbs:
  android: circleci/android@3.0.2

executors:
  android-executor:
    docker:
      - image: circleci/android:api-30-ndk
    working_directory: ~/repo/core-methods

jobs:
  build:
    executor: android-executor
    steps:
      - checkout

      - run:
          name: Set up JDK 17
          command: |
            echo "export JAVA_HOME=/usr/lib/jvm/java-17-openjdk" >> $BASH_ENV
            echo "export PATH=\$JAVA_HOME/bin:\$PATH" >> $BASH_ENV
            source $BASH_ENV

      - run:
          name: Install dependencies
          command: ../gradlew dependencies

      - run:
          name: Build the app
          command: ../gradlew assemble

      - run:
          name: Run Detekt
          command: ../gradlew detekt

      - run:
          name: Run KLint
          command: ../gradlew ktlintCheck

      - run:
          name: Run unit tests
          command: ../gradlew test

workflows:
  version: 2
  build:
    jobs:
      - build
