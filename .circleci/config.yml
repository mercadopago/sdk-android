version: 2.1

orbs:
  android: circleci/android@3.0.2

executors:
  android-executor:
    docker:
      - image: cimg/openjdk:23.0.1
    working_directory: ~/repo/core-methods

jobs:
  build:
    executor: android-executor
    steps:
      - checkout
      - run:
          name: Check Java Version
          command: |
            java -version
      - run:
          name: Build the app
          command: ./gradlew assemble
      - run:
          name: Run Detekt
          command: ./gradlew detekt
      - run:
          name: Run KLint
          command: ./gradlew ktlintCheck
      - run:
          name: Run unit tests
          command: ./gradlew test

workflows:
  version: 2
  build:
    jobs:
      - build
