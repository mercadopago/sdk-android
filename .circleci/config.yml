version: 2.1

orbs:
  android: circleci/android@3.0.2

executors:
  android-executor:
    docker:
      - image: circleci/android:api-30
    working_directory: ~/repo

jobs:
  # SETUP STEP
  setup:
    executor:
      name: android/android_machine
      tag: default
      docker:
        - image: circleci/android:api-30
    steps:
      - checkout
      - run:
          name: Verify ANDROID_HOME
          command: |
            echo $ANDROID_HOME
      - run:
          name: Set up ANDROID_HOME
          command: |
            echo 'export ANDROID_HOME=/opt/android-sdk' >> $BASH_ENV
            echo 'export PATH=$ANDROID_HOME/emulator:$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH' >> $BASH_ENV
            echo 'export HIDDEN_API_FATAL_WARNING=false' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Check Java Version
          command: java -version

      - run:
          name: Install dependencies
          command: ./gradlew dependencies

# TEST STEP
  test:
    executor:
      name: android/android_machine
      tag: default
      docker:
        - image: circleci/android:api-30
    steps:
      - run:
          name: Run Detekt
          command: ./gradlew detekt
      - run:
          name: Run KLint Check
          command: ./gradlew ktlintCheck

      - android/restore_gradle_cache

      - android/run_tests

      - android/save_gradle_cache

  # BUILD STEP
  build:
    executor:
      name: android/android_machine
      tag: default
      docker:
        - image: circleci/android:api-30
    docker:
      - image: cimg/openjdk:17.0.13
    steps:
      - run:
          name: Build the app
          command: ./gradlew assemble

workflows:
  version: 2
  build:
    jobs:
      - setup
      - test:
          requires:
            - setup
      - build:
          requires:
            - test
