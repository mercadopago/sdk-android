version: 2.1

orbs:
  android: circleci/android@3.0.2

executors:
  android-executor:
    docker:
      - image: circleci/android:api-30
    working_directory: ~/repo/core-methods

jobs:
  setup:
    executor: android-executor
    steps:
      - checkout
      - run:
          name: Set up ANDROID_HOME
          command: |
            echo 'export ANDROID_HOME=/opt/android-sdk' >> $BASH_ENV
            echo 'export PATH=$ANDROID_HOME/emulator:$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH' >> $BASH_ENV
            echo 'export HIDDEN_API_FATAL_WARNING=false' >> $BASH_ENV
            source $BASH_ENV

  build:
    executor: android-executor
    docker:
      - image: cimg/openjdk:17.0.13
    steps:
      - checkout
      - run:
          name: Check Java Version
          command: java -version
      - run:
          name: Install dependencies
          command: ./gradlew dependencies
      - run:
          name: Run Detekt
          command: ./gradlew detekt
      - run:
          name: Run KLint
          command: ./gradlew ktlintCheck
      - run:
          name: Run unit tests
          command: ./gradlew test
      - run:
          name: Build the app
          command: ./gradlew assemble

workflows:
  version: 2
  build:
    jobs:
      - setup
      - build:
          requires:
            - setup
