version: 2.1

orbs:
  android: circleci/android@3.0.2

executors:
  android-executor:
    docker:
      - image: circleci/android:api-30
    working_directory: ~/repo

jobs:
  build-test:
    circleci_ip_ranges: true
    executor: android-executor
    docker:
      - image: cimg/openjdk:17.0.13
    resource_class: xlarge
    steps:
      # PRE SETUP
      - run:
          name: Install Git LFS
          command: |
            curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
            sudo apt-get install git-lfs
            git lfs install --skip-smudge
      - checkout
      - run: git lfs fetch --all
      - run:
          name: Set Secrets File
          command: echo "$SECRETS_FILE" | base64 --decode > secrets.properties
      - run:
          name: Check JDK exists
          command: javac -version
      - run:
          name: Download Platform Tools
          command: |
            cd ..
            mkdir android-sdk
            cd android-sdk
            wget https://dl.google.com/android/repository/platform-tools-latest-linux.zip
            unzip platform-tools-latest-linux.zip
      - run:
          name: Download Commandline Tools
          command: |
            cd ..
            cd android-sdk
            mkdir cmdline-tools
            cd cmdline-tools
            wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip commandlinetools-linux-11076708_latest.zip
            mv cmdline-tools latest
      - run:
          name: Set up Android Home
          command: |
            echo '
            export ANDROID_HOME=$HOME/android-sdk
            export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
            export PATH=$PATH:$HOME/android-sdk/platform-tools' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Verify Android Home
          command: echo $ANDROID_HOME
      - run:
          name: Accept SDK licenses
          command: |
            yes | sdkmanager --licenses || exit 0
            yes | sdkmanager --update || exit 0

      # SETUP STEP
      - run:
          name: Check Java Version
          command: java -version

      - run:
          name: Install Dependencies
          command: ./gradlew dependencies

      # PRE TEST
      - run:
          name: KLint Format
          command: ./gradlew ktlintFormat

      # TEST STEP
      - run:
          name: Run Detekt
          command: ./gradlew detekt
      - run:
          name: Run KLint Check
          command: ./gradlew ktlintCheck
      - run:
          name: Run Code Coverage
          command: ./gradlew koverXmlReportDebug
      #      - run:
      #          name: Run Screenshot Tests
      #          command: ./gradlew verifyPaparazziDebug
      - store_test_results:
          path: core-methods/build/reports/kover/reportDebug.xml

      # DOCUMENTATION STEP
      - run:
          name: Update Dokka Documentation
          command: ./gradlew dokkaHtmlMultiModule

      - persist_to_workspace:
          root: build/dokka/
          paths:
            - htmlMultiModule

      # BUILD STEP
      - run:
          name: Build the app
          command: ./gradlew assemble --stacktrace
      - run:
          name: Archive APK
          command: |
            mkdir -p ~/circleci-artifacts
            cp example/build/outputs/apk/debug/example-debug.apk ~/circleci-artifacts/
      - run:
          name: Archive .AAR
          command: |
            mkdir -p ~/circleci-artifacts
            cp core-methods/build/outputs/aar/core-methods-debug.aar ~/circleci-artifacts/
      - store_artifacts:
          path: ~/circleci-artifacts
          destination: apk

  docs-deploy:
    executor: android-executor
    docker:
      - image: cimg/node:16.17
    steps:
      - run:
          name: Install Git LFS
          command: |
            curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
            sudo apt-get install git-lfs
            git lfs install --skip-smudge
      - checkout
      - run: git lfs fetch --all
      - attach_workspace:
          at: build/dokka/
      - run:
          name: Disable Jekyll for GitHub Pages
          command: touch build/dokka/htmlMultiModule/.nojekyll
      - run:
          name: Install gh-pages tool
          command: npm install gh-pages@3.2.3 --silent
      - add_ssh_keys:
          fingerprints:
            - "SHA256:CHbCMOR2Mcw/RHacZ+LuEOqsvk0Vis+R3lzMcdpy9y0"
      - run:
          name: Configure Git for deployment
          command: |
            git config --global user.email "dev@mercadopago.com"
            git config --global user.name "CI Build"
      - run:
          name: Deploy documentation to GitHub Pages
          command: npx gh-pages --dotfiles --message "[skip ci] Updates" --dist build/dokka/htmlMultiModule

  publish-maven:
    circleci_ip_ranges: true
    executor: android-executor
    docker:
      - image: cimg/openjdk:17.0.13
    steps:
      - checkout
      - run:
          name: Validate Version
          command: |
            TAG_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v\.//')
            echo "Tag version: $TAG_VERSION"

            # Extract version from BomConfig.kt and save to ENV variable
            CONFIG_VERSION=$(grep 'VERSION_NAME' buildSrc/src/main/kotlin/com/mercadopago/sdk/android/BomConfig.kt | cut -d '"' -f2 | tr -cd '0-9.')
            echo "Config version: $CONFIG_VERSION"
            echo "CONFIG_VERSION=$CONFIG_VERSION" >> $BASH_ENV  # Save CONFIG_VERSION

            # Compare versions
            if [ "$TAG_VERSION" == "$CONFIG_VERSION" ]; then
              echo "Versions are the same. Skipping release."
              exit 1
            fi
            echo "Versions are different. Creating release."
      - run:
          name: Publish to Maven
          command: |
            echo "Publishing to Maven..."
            ORG_GRADLE_PROJECT_sdkAndroidUsername=$(echo $ORG_GRADLE_PROJECT_sdkAndroidUsername | base64 --decode)
            ORG_GRADLE_PROJECT_sdkAndroidPassword=$(echo $ORG_GRADLE_PROJECT_sdkAndroidPassword | base64 --decode)
            ./gradlew publish
      - run:
          name: Create GitHub Release
          command: |
            # Install GitHub CLI
            type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
              && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
              && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
              && sudo apt update \
              && sudo apt install gh -y

            # Use CONFIG_VERSION from ENV
            echo "Release Notes for ${CONFIG_VERSION}" > release_notes.md
            echo "---" >> release_notes.md
            echo "## What's Changed" >> release_notes.md

            # Get commits since last tag
            git fetch --tags
            LAST_TAG=$(git describe --tags --abbrev=0 ${CIRCLE_TAG}^ 2>/dev/null || echo "")
            if [ ! -z "$LAST_TAG" ]; then
              git log --pretty=format:"* %s" ${LAST_TAG}..${CONFIG_VERSION} >> release_notes.md
            else
              git log --pretty=format:"* %s" ${CONFIG_VERSION} >> release_notes.md
            fi
            # Create GitHub release
            echo "$GITHUB_TOKEN" | gh auth login --with-token
            gh release create ${CONFIG_VERSION} \
              --title "Release ${CONFIG_VERSION}" \
              --notes-file release_notes.md
workflows:
  version: 2
  build:
    jobs:
      - build-test
      - docs-deploy:
          requires:
            - build-test
          filters:
            branches:
              only: main
      - publish-maven:
          requires:
            - build-test
