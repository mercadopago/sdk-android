version: 2.1

orbs:
  android: circleci/android@3.0.2

executors:
  android-executor:
    docker:
      - image: circleci/android:api-30
    working_directory: ~/repo

jobs:
  build-test:
    circleci_ip_ranges: true
    executor: android-executor
    docker:
      - image: cimg/openjdk:17.0.13
    resource_class: xlarge
    steps:
      # PRE SETUP
      - run:
          name: Install Git LFS
          command: |
            curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
            sudo apt-get install git-lfs
            git lfs install --skip-smudge
      - checkout
      - run: git lfs fetch --all
      - run:
          name: Set Secrets File
          command: echo "$SECRETS_FILE" | base64 --decode > secrets.properties
      - run:
          name: Check JDK exists
          command: javac -version
      - run:
          name: Download Platform Tools
          command: |
            cd ..
            mkdir android-sdk
            cd android-sdk
            wget https://dl.google.com/android/repository/platform-tools-latest-linux.zip
            unzip platform-tools-latest-linux.zip
      - run:
          name: Download Commandline Tools
          command: |
            cd ..
            cd android-sdk
            mkdir cmdline-tools
            cd cmdline-tools
            wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip commandlinetools-linux-11076708_latest.zip
            mv cmdline-tools latest
      - run:
          name: Set up Android Home
          command: |
            echo '
            export ANDROID_HOME=$HOME/android-sdk
            export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
            export PATH=$PATH:$HOME/android-sdk/platform-tools' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Verify Android Home
          command: echo $ANDROID_HOME
      - run:
          name: Accept SDK licenses
          command: |
            yes | sdkmanager --licenses || exit 0
            yes | sdkmanager --update || exit 0

      # SETUP STEP
      - run:
          name: Check Java Version
          command: java -version

      - run:
          name: Install Dependencies
          command: ./gradlew dependencies

      # PRE TEST
      - run:
          name: KLint Format
          command: ./gradlew ktlintFormat

      # TEST STEP
      - run:
          name: Run Detekt
          command: ./gradlew detekt
      - run:
          name: Run KLint Check
          command: ./gradlew ktlintCheck
      - run:
          name: Run Code Coverage
          command: ./gradlew koverXmlReportDebug
      #      - run:
      #          name: Run Screenshot Tests
      #          command: ./gradlew verifyPaparazziDebug
      - store_test_results:
          path: core-methods/build/reports/kover/reportDebug.xml

      # DOCUMENTATION STEP
      - run:
          name: Update Dokka Documentation
          command: ./gradlew dokkaHtmlMultiModule

      - persist_to_workspace:
          root: build/dokka/
          paths:
            - htmlMultiModule

      # BUILD STEP
      - run:
          name: Build the app
          command: ./gradlew assemble --stacktrace
      - run:
          name: Archive APK
          command: |
            mkdir -p ~/circleci-artifacts
            cp example/build/outputs/apk/debug/example-debug.apk ~/circleci-artifacts/
      - run:
          name: Archive .AAR
          command: |
            mkdir -p ~/circleci-artifacts
            cp core-methods/build/outputs/aar/core-methods-debug.aar ~/circleci-artifacts/
      - store_artifacts:
          path: ~/circleci-artifacts
          destination: apk

  docs-deploy:
    executor: android-executor
    docker:
      - image: cimg/node:16.17
    steps:
      - run:
          name: Install Git LFS
          command: |
            curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
            sudo apt-get install git-lfs
            git lfs install --skip-smudge
      - checkout
      - run: git lfs fetch --all
      - attach_workspace:
          at: build/dokka/
      - run:
          name: Disable Jekyll for GitHub Pages
          command: touch build/dokka/htmlMultiModule/.nojekyll
      - run:
          name: Install gh-pages tool
          command: npm install gh-pages@3.2.3 --silent
      - add_ssh_keys:
          fingerprints:
            - "SHA256:CHbCMOR2Mcw/RHacZ+LuEOqsvk0Vis+R3lzMcdpy9y0"
      - run:
          name: Configure Git for deployment
          command: |
            git config --global user.email "dev@mercadopago.com"
            git config --global user.name "CI Build"
      - run:
          name: Deploy documentation to GitHub Pages
          command: npx gh-pages --dotfiles --message "[skip ci] Updates" --dist build/dokka/htmlMultiModule

  publish-maven:
    circleci_ip_ranges: true
    executor: android-executor
    docker:
      - image: cimg/openjdk:17.0.13
    steps:
      # PRE SETUP
      - run:
          name: Install Git LFS
          command: |
            curl -s https://packagecloud.io/install/repositories/github/git-lfs/script.deb.sh | sudo bash
            sudo apt-get install git-lfs
            git lfs install --skip-smudge
      - checkout
      - run: git lfs fetch --all
      - run:
          name: Set Secrets File
          command: echo "$SECRETS_FILE" | base64 --decode > secrets.properties
      - run:
          name: Check JDK exists
          command: javac -version
      - run:
          name: Download Platform Tools
          command: |
            cd ..
            mkdir android-sdk
            cd android-sdk
            wget https://dl.google.com/android/repository/platform-tools-latest-linux.zip
            unzip platform-tools-latest-linux.zip
      - run:
          name: Download Commandline Tools
          command: |
            cd ..
            cd android-sdk
            mkdir cmdline-tools
            cd cmdline-tools
            wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip commandlinetools-linux-11076708_latest.zip
            mv cmdline-tools latest
      - run:
          name: Set up Android Home
          command: |
            echo '
            export ANDROID_HOME=$HOME/android-sdk
            export PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin
            export PATH=$PATH:$HOME/android-sdk/platform-tools' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Verify Android Home
          command: echo $ANDROID_HOME
      - run:
          name: Accept SDK licenses
          command: |
            yes | sdkmanager --licenses || exit 0
            yes | sdkmanager --update || exit 0

      # SETUP STEP
      - run:
          name: Check Java Version
          command: java -version
      - run:
          name: Install Dependencies
          command: ./gradlew dependencies
      - run:
          name: Publish to Maven
          command: |
            echo "export ORG_GRADLE_PROJECT_sdkAndroidUsername=$(echo $ORG_GRADLE_PROJECT_sdkAndroidUsername | base64 --decode)" >> $BASH_ENV
            echo "export ORG_GRADLE_PROJECT_sdkAndroidPassword=$(echo $ORG_GRADLE_PROJECT_sdkAndroidPassword | base64 --decode)" >> $BASH_ENV
            MODULES=("core" "analytics" "sdk-android" "core-methods" "sdk-android-bom")
            any_published=0
            for MODULE in "${MODULES[@]}"; do
              VERSION=$(./gradlew -q ":$MODULE:properties" | grep "^version:" | awk '{print $2}')
              ARTIFACT_URL="https://artifacts.mercadolibre.com/service/rest/repository/browse/android-releases/com/mercadopago/android/sdk/$MODULE/$VERSION/"
              if curl -sfI "$ARTIFACT_URL" > /dev/null; then
                echo "Module $MODULE: version $VERSION already exists, skipping publish for this module."
              else
                echo "Publishing $MODULE:$VERSION ..."
                ./gradlew ":$MODULE:publish" || echo "Publish failed for $MODULE"
                any_published=1
              fi
            done

            if [[ $any_published -eq 0 ]]; then
              echo "No modules needed to be published. Skipping release creation."
              circleci-agent step halt
            else
              echo "export SHOULD_CREATE_RELEASE=true" >> $BASH_ENV
            fi
      - run:
          name: Create GitHub Release
          command: |
            if [[ "${SHOULD_CREATE_RELEASE}" != "true" ]]; then
              echo "Skipping release creation as no modules were published"
              exit 0
            fi

            # Install GitHub CLI
            type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
              && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
              && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
              && sudo apt update \
              && sudo apt install gh -y

            BOM_VERSION=$(./gradlew -q ":sdk-android-bom:properties" | grep "^version:" | awk '{print $2}')
            echo "Release Notes for ${BOM_VERSION}" > release_notes.md
            echo "---" >> release_notes.md
            echo "## What's Changed" >> release_notes.md

            if git rev-parse "refs/tags/${BOM_VERSION}" >/dev/null 2>&1; then
              echo "Tag ${BOM_VERSION} already exists. Skipping tag creation."
            else
              git tag "${BOM_VERSION}"
              git push origin "${BOM_VERSION}"
              echo "Tag ${BOM_VERSION} created and pushed."
            fi

            # Get commits since last tag
            git fetch --tags
            LAST_TAG=$(git describe --tags --abbrev=0 ${CIRCLE_TAG}^ 2>/dev/null || echo "")
            if [ ! -z "$LAST_TAG" ]; then
              git log --pretty=format:"* %s" ${LAST_TAG}..${BOM_VERSION} >> release_notes.md
            else
              git log --pretty=format:"* %s" ${BOM_VERSION} >> release_notes.md
            fi

            # Create GitHub release
            gh release create ${BOM_VERSION} \
              --title "Release ${BOM_VERSION}" \
              --notes-file release_notes.md
workflows:
  version: 2
  build:
    jobs:
      - build-test
      - docs-deploy:
          requires:
            - build-test
          filters:
            branches:
              only: main
      - publish-maven:
          requires:
            - build-test
          filters:
            branches:
              only: main
