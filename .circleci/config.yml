version: 2.1

orbs:
  android: circleci/android@3.0.2

executors:
  android-executor:
    docker:
      - image: circleci/android:api-30
    working_directory: ~/repo

jobs:
  install_dependencies:
    docker:
      - image: cimg/openjdk:17.0.13
    executor: android-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: ./gradlew dependencies

  assemble:
    executor: android-executor
    steps:
      - checkout
      - run:
          name: Assemble the library
          command: ./gradlew assemble  # Ensure that your build.gradle is correctly set

  run_detekt:
    docker:
      - image: cimg/openjdk:17.0.13
    executor: android-executor
    steps:
      - checkout
      - run:
          name: Run Detekt
          command: ./gradlew detekt

  run_ktlint:
    docker:
      - image: cimg/openjdk:17.0.13
    executor: android-executor
    steps:
      - checkout
      - run:
          name: Run Ktlint
          command: ./gradlew ktlintCheck

workflows:
  version: 2
  build:
    jobs:
      - install_dependencies
      - assemble
      - run_detekt
      - run_ktlint
